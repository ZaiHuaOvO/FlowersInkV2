<nz-layout class="layout">
  <nz-header class="app-header">
    <flower-header></flower-header>
  </nz-header>
  <nz-content>
    <router-outlet></router-outlet>
  </nz-content>
  <nz-footer>
    <flower-footer></flower-footer>
  </nz-footer>
</nz-layout>

<!-- 全局加载指示器：统一用「粉毛再花 · 死机」动图配「加载中」。
     由 AppComponent 通过 nzConfigService.set('spin', { nzIndicator }) 设给全站 nz-spin -->
<ng-template #loadingTemplate>
  <span class="global-loading-indicator">
    <img
      class="global-loading-gif"
      src="assets/%E7%B2%89%E6%AF%9B%E5%86%8D%E8%8A%B1/%E6%AD%BB%E6%9C%BA.gif"
      alt=""
    />
    <span class="global-loading-text">加载中</span>
  </span>
</ng-template>

<!-- 回到顶部 -->
<flower-back-top></flower-back-top>

<!-- 加入书签轻提示（浏览一段时间后底部弹出） -->
<flower-bookmark-prompt></flower-bookmark-prompt>
