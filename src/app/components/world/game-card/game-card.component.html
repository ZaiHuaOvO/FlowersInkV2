<a
  class="game-tile"
  flCard
  flCardHover
  [flTooltip]="game.name"
  [attr.href]="'/game/' + game.id"
  [attr.aria-label]="ariaLabel || game.name"
  [attr.aria-disabled]="revealed ? null : 'true'"
  [attr.tabindex]="revealed ? null : -1"
  (click)="onCardClick($event)"
>
  <span class="game-tile__cover">
    @if (coverLoading) {
    <span class="game-tile__cover-skeleton" aria-hidden="true"></span>
    } @else if (coverUrl) {
    <img
      flImgFade
      loading="lazy"
      decoding="async"
      [src]="coverUrl"
      [alt]="game.name + ' 封面'"
    />
    } @else {
    <span class="game-tile__cover-empty" aria-hidden="true">{{ initial }}</span>
    }

    @if (!coverLoading) {
    <span class="game-tile__badge">
      <flower-game-recommend-badge
        [recommend]="game.recommend"
      ></flower-game-recommend-badge>
    </span>
    }
  </span>
</a>
