<a
  class="game-tile"
  flCard
  flCardHover
  [attr.href]="'/game/' + game.id"
  [attr.title]="game.name"
  [attr.aria-label]="ariaLabel || game.name"
  (click)="onCardClick($event)"
>
  <span class="game-tile__cover">
    @if (coverUrl) {
    <img
      flImgFade
      loading="lazy"
      decoding="async"
      [src]="coverUrl"
      [alt]="game.name + ' 封面'"
    />
    } @else {
    <span class="game-tile__cover-empty" aria-hidden="true">{{ initial }}</span>
    }
    <span class="game-tile__badge">
      <flower-game-recommend-badge
        [recommend]="game.recommend"
      ></flower-game-recommend-badge>
    </span>
  </span>
</a>
