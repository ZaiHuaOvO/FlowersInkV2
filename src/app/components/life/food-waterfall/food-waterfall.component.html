<div class="waterfall-container" flCard>
  @for (item of data; track item) {
    <div class="waterfall-item" role="button" tabindex="0" aria-label="查看这条点滴"
      (click)="isMobile ? getLifeDetailMobile(item) : getLifeDetail(item)"
      (keydown.enter)="isMobile ? getLifeDetailMobile(item) : getLifeDetail(item)"
      (keydown.space)="$event.preventDefault(); isMobile ? getLifeDetailMobile(item) : getLifeDetail(item)">
      <img
        flImgFade
        loading="lazy"
        decoding="async"
        [src]="item.image_first[0].url"
        [alt]="item.title"
      />
      <div class="food_name">
        <h5 nz-typography style="white-space: pre-wrap; text-align: center;" class="noto-sans-sc">{{ item.title
        }}</h5>
        <p nz-typography nzType="secondary" nzEllipsis nzEllipsisRows="2" [nzContent]="item.content"></p>
      </div>
    </div>
  }


</div>
