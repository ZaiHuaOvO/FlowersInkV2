<div class="message" nz-flex nzAlign="center" nzJustify="center" [nzVertical]="true">
  <!-- 绝对定位的导航 -->
  @if (!isMobile) {
  <flower-target></flower-target>
  }
  <div class="content" flCard nz-flex [nzVertical]="true" @QuickUp>
    <h1 nz-typography class="fi-page-title">留言板</h1>
    <p nz-typography nzType="secondary">留言或许很难让你会有什么收获,但会让再花获得快乐</p>
    <nz-spin class="message-spin" [nzTip]="'留言正在赶来中'" [nzSpinning]="loading">
      <div nz-flex [nzVertical]="true">
        <flower-edit-message class="message-editor"></flower-edit-message>
        <nz-divider></nz-divider>
        <div class="message-list-wrap" [@StaggerList]>
          <nz-list [nzDataSource]="data" [nzRenderItem]="item" [nzItemLayout]="'horizontal'" nzNoResult="居然没有留言(T⌓T)">
            <ng-template #item let-item>
              <nz-comment [nzAuthor]="name" [nzDatetime]="date">
                <nz-comment-content>
                  <p class="content_text noto-sans-sc">{{ item.content }}</p>
                </nz-comment-content>
                <ng-template #name>
                  @if (!item.url) {
                  <span class="name noto-sans-sc">{{item.name}}</span>
                  }
                  @if (item.url) {
                  <a class="url_name noto-sans-sc" (click)="navigateToUrl(item.url)">{{item.name}}</a>
                  }
                </ng-template>
                <ng-template #date>
                  <span>{{item.createDate | date:'yyyy-MM-dd HH:mm:ss'}}</span>
                </ng-template>
              </nz-comment>
            </ng-template>
          </nz-list>
        </div>
        <nz-pagination [nzPageIndex]="page" [nzTotal]="count" nzSimple nzHideOnSinglePage="true"></nz-pagination>
      </div>
    </nz-spin>
    @if (!isMobile) {
    <div class="nav-links">
      <a class="nav-link" [routerLink]="['/about/website']">←关于网站</a>
      <span></span>
    </div>
    }
  </div>
  @if (isMobile) {
  <div class="nav-links">
    <span></span>
    <a class="nav-link" [routerLink]="['/about/website']">←关于网站</a>
  </div>
  }
</div>
