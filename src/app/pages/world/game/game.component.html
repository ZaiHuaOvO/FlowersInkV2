<div class="game" nz-flex [nzVertical]="true" nzAlign="center">
  <div class="content game-content" nz-flex nzGap="middle" nzJustify="start" nzAlign="center" [nzVertical]="true" @QuickUp>
    <flower-blog-title [title]="'再花的游戏库'"></flower-blog-title>
    <div class="game-toolbar">
      <div class="game-toolbar__spacer" aria-hidden="true"></div>
      <p nz-typography class="game-summary">
        共记录
        <strong class="game-summary__value">{{totalGames}}</strong>
        款游戏，时长
        <strong class="game-summary__value">{{totalPlayingTime | number:'1.1'}}</strong>
        小时
      </p>
      <div class="game-toolbar__spacer" aria-hidden="true"></div>
    </div>
    <nz-spin class="game-spin" [nzTip]="'游戏正在努力赶来中'" [nzSpinning]="loading">
      @if (data.length > 0) {
        <nz-row
          class="game-grid game-grid--overview"
          [nzGutter]="[20,20]"
          nzJustify="center"
        >
          @for (game of data; track game; let i = $index) {
            <nz-col
              class="game-grid__col game-grid__col--overview"
              [nzXs]="24"
              [nzSm]="12"
              [nzMd]="8"
              [nzLg]="8"
              [nzXl]="6"
            >
              <flower-game-card [game]="game" (cardClick)="openDetailDialog(game, $event)"></flower-game-card>
            </nz-col>
          }
        </nz-row>
      } @else if (!loading) {
        <div class="game-empty" nz-flex nzAlign="center" nzJustify="center" nzVertical>
          <span class="game-empty-icon">🎮</span>
          <span nz-typography class="game-empty-text">还没有记录任何游戏</span>
        </div>
      }
    </nz-spin>
    <flower-comment-section type="game"></flower-comment-section>
  </div>
</div>
