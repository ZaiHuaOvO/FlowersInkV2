<div class="life-dialog">
  @if (item) {
  <article class="life-dialog-card">
    <nz-tag flTag class="life-card-tag life-card-tag-topright" [ngClass]="getTagClass(item.primaryTag)">
      {{ item.primaryTag || '未分类' }}
    </nz-tag>

    @if (item.title) {
    <header class="life-card-header">
      <h4>{{ item.title }}</h4>
    </header>
    }

    <p class="life-card-content" [class.life-card-content-excerpt]="isExcerpt()"
      [class.life-card-content-no-title]="!item.title">
      {{ item.content }}
    </p>

    @if (item.images.length > 0) {
    <div class="image-grid" [ngClass]="getImageGridClass()">
      @for (image of item.images; track image.previewUrl) {
      <div class="{{ getImageItemClass() }}" (click)="previewZoom($event, image)">
        <img loading="lazy" decoding="async" [src]="image.displayUrl" (error)="onImageError($event, image)" alt="点滴图片" />
        <div class="image-overlay">
          <span class="origin-btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
              <circle cx="11" cy="11" r="7" />
              <path d="M16.5 16.5L21 21" />
              <path d="M11 8v6M8 11h6" />
            </svg>
          </span>
        </div>
      </div>
      }
    </div>
    }

    @if (shouldShowSource()) {
    <p class="life-card-source">来自：{{ item.source }}</p>
    }

    <footer class="life-card-meta">
      <span class="life-card-time">{{ item.dateText }}</span>
      <div class="life-card-actions" nz-flex nzAlign="center" nzGap="small">
        <button
          type="button"
          class="life-comment-btn"
          [class.life-comment-btn--active]="commentsOpen"
          (click)="toggleComments()"
          [attr.aria-label]="commentsOpen ? '收起评论' : '展开评论'"
        >
          <span nz-icon nzType="message" nzTheme="outline"></span>
          <span class="life-comment-count">{{ item.commentCount }}</span>
        </button>
        <button
          type="button"
          class="life-like-btn"
          [class.life-like-btn--liked]="isLiked"
          [class.life-like-btn--animate]="animatingIds.has(item.id)"
          (click)="toggleLike()"
          [attr.aria-label]="isLiked ? '已点赞' : '点赞'"
        >
          <span nz-icon nzType="heart" [nzTheme]="isLiked ? 'fill' : 'outline'"></span>
          <span class="life-like-count">{{ likeCount }}</span>
        </button>
      </div>
    </footer>

    <flower-life-comments [lifeId]="item.id" [commentCount]="item.commentCount" [open]="commentsOpen" [showAll]="true"></flower-life-comments>
  </article>
  }
</div>
