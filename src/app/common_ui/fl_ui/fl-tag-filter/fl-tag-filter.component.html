<div class="tag-filter-list">
  @for (tagItem of renderItems(); track tagItem.tag) {
    <button type="button" class="tag-filter-button" [class.active]="isActive(tagItem.tag)"
      (click)="onSelect(tagItem.tag)">
      <span class="tag-filter-main">
        <span class="tag-filter-icon-svg" aria-hidden="true">
          @if (tagItem.tag === '全部') {
            <!-- 「全部」不是真实标签，图形固定在这儿，不进图标目录 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 15c2.4 0 3.7-3 6-3s3.6 3 6 3 4-1.8 4-4-1.6-4-4-4-3.7 3-6 3-3.6-3-6-3-4 1.8-4 4 1.6 4 4 4z"/>
            </svg>
          } @else {
            <!-- 图形按标签配的图标 key 从目录里取，后台配的就是这里看到的 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              @for (shape of shapesFor(tagItem); track $index) {
                @switch (shape.t) {
                  @case ('path') {
                    <path [attr.d]="shape.d"></path>
                  }
                  @case ('circle') {
                    <circle [attr.cx]="shape.cx" [attr.cy]="shape.cy" [attr.r]="shape.r"></circle>
                  }
                  @case ('rect') {
                    <rect
                      [attr.x]="shape.x"
                      [attr.y]="shape.y"
                      [attr.width]="shape.width"
                      [attr.height]="shape.height"
                      [attr.rx]="shape.rx"
                    ></rect>
                  }
                }
              }
            </svg>
          }
        </span>
        <span>{{ tagItem.tag }}</span>
      </span>
      <span class="tag-count">{{ tagItem.count }}</span>
    </button>
  }
</div>
