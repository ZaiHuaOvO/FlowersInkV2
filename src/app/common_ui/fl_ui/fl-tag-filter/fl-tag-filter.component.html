<div class="tag-filter-list">
  @for (tagItem of renderItems(); track tagItem.tag) {
    <button type="button" class="tag-filter-button" [class.active]="isActive(tagItem.tag)"
      (click)="onSelect(tagItem.tag)">
      <span class="tag-filter-main">
        <span class="tag-filter-icon-svg" aria-hidden="true">
          @switch (tagItem.tag) {
            @case ('全部') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 15c2.4 0 3.7-3 6-3s3.6 3 6 3 4-1.8 4-4-1.6-4-4-4-3.7 3-6 3-3.6-3-6-3-4 1.8-4 4 1.6 4 4 4z"/>
              </svg>
            }
            @case ('再花') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            }
            @case ('见闻') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
            @case ('游戏') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/>
                <path d="M17.3 5H6.7a4 4 0 0 0-3.9 3.1L1.5 17a2.5 2.5 0 0 0 3.2 2.9l3.8-1.2a4 4 0 0 1 2.9 0l3.8 1.2a2.5 2.5 0 0 0 3.2-2.9L21.2 8.1A4 4 0 0 0 17.3 5z"/>
              </svg>
            }
            @case ('教程') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 4h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 4h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
              </svg>
            }
            @case ('网站建设') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            }
            @case ('电脑相关') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8M12 17v4"/>
              </svg>
            }
            @case ('AI') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.9 2.6a.5.5 0 0 1 .9 0l1.6 4.8a.5.5 0 0 0 .3.3l4.8 1.6a.5.5 0 0 1 0 .9l-4.8 1.6a.5.5 0 0 0-.3.3l-1.6 4.8a.5.5 0 0 1-.9 0l-1.6-4.8a.5.5 0 0 0-.3-.3l-4.8-1.6a.5.5 0 0 1 0-.9l4.8-1.6a.5.5 0 0 0 .3-.3z"/>
                <path d="M19 15l.9 2.6L22.5 18.5l-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z"/>
              </svg>
            }
            @case ('杂谈') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
              </svg>
            }
            @default {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.6 13.4 11 3.8a2 2 0 0 0-1.4-.6H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z"/>
                <circle cx="7.5" cy="7.5" r="1.5"/>
              </svg>
            }
          }
        </span>
        <span>{{ tagItem.tag }}</span>
      </span>
      <span class="tag-count">{{ tagItem.count }}</span>
    </button>
  }
</div>
